name: news
on:
  schedule:
    # каждые 20 минут с 07:03 до 22:43 по Ташкенту (UTC+5)
    - cron: "3,23,43 2-17 * * *"
  workflow_dispatch:

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Fonts
        run: ls /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || sudo apt-get install -y -q fonts-dejavu-core
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Seed state on first run
        run: |
          mkdir -p data
          [ -f data/news.db ] || cp seed/news.db data/news.db 2>/dev/null || true
      - name: Post
        run: python main.py tick
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: state-${{ github.run_id }}
