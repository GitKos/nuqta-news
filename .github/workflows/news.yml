name: news
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # страховка: если цепочка оборвалась, запустить заново

# одновременно работает только один цикл; новый запуск при живом старом отменяется
concurrency:
  group: news-loop
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355            # лимит GitHub на job — 6 часов
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Seed state on first run
        run: |
          mkdir -p data
          [ -f data/news.db ] || cp seed/news.db data/news.db 2>/dev/null || true
      - name: Tick every 5 minutes for ~5.5 hours
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          end=$(( $(date +%s) + 330*60 ))
          while [ $(date +%s) -lt $end ]; do
            python main.py tick || true
            sleep 300
          done
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: state-${{ github.run_id }}
      - name: Start next cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news -R ${{ github.repository }}
